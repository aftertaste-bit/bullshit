<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <title>Release Durumu</title>
  <style>
    * {
      font-family: 'Poppins', sans-serif;
    }
    body {
      background-color: #f4f4f4;
      height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      position: relative;
      overflow-x: hidden;
    }
    h1 {
      margin-bottom: 40px;
      text-align: center;
      z-index: 2;
    }
    .spinner {
      border: 6px solid #ccc;
      border-top: 6px solid #333;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    video.inline-video {
      width: 80%;
      max-height: 400px;
      display: block;
      margin: 20px auto;
      z-index: 2;
    }
    #result {
      font-size: 24px;
      font-weight: bold;
      text-align: center;
      color: #008000;
      z-index: 2;
    }
    #rotatingText {
      font-size: 18px;
      margin-top: 10px;
      min-height: 48px;
      z-index: 2;
    }
    #actionArea {
      z-index: 2;
    }
  </style>
</head>
<body>

  <h1>ÇEKTİĞİMİZ ACILAR BİR GÜN BİTECEK Mİ?</h1>

  <div id="actionArea" class="text-center">
    <div id="result" style="color: #FFD700">BELİRSİZ</div> <br>
    <button id="askBtn" class="btn btn-primary btn-lg">ALLAHA SOR</button>
  </div>

  <script>
    const actionArea = document.getElementById('actionArea');

    const texts = [
      "Yeni iş bulabilecek miyim?",
      "Türkiye'de ekonomi düzelir mi?",
      "Yalnız kalmaktan kurtulur muyum?",
      "Beni gerçekten seven biri var mı?",
      "Bu site saçmalıyor olabilir mi?"
    ];

    async function fetchResultText() {
      const sheetId = '1qB983hwYXVkNW9aIVzePYDOoQR92_G18oJ2MoXkti5E';
      const apiKey = 'AIzaSyCqtZSxgV7yeeKHNlVbdBvNXRX6n3t3cB8';
      const url = `https://sheets.googleapis.com/v4/spreadsheets/${sheetId}/values/Sheet1!A1?alt=json&key=${apiKey}`;
      try {
        const response = await fetch(url);
        const json = await response.json();
        return json.values[0][0];
      } catch (e) {
        console.error("Error fetching live data:", e);
        return 'HAYIR';
      }
    }

    async function startProcess() {
      actionArea.innerHTML = `
        <div class="spinner"></div>
        <div id="rotatingText">${texts[0]}</div>
      `;

      const resultText = await fetchResultText();

      const rotatingText = document.getElementById('rotatingText');
      let textIndex = 1;
      const textInterval = setInterval(() => {
        rotatingText.textContent = texts[textIndex];
        textIndex = (textIndex + 1) % texts.length;
      }, 2000);

      const video = document.createElement('video');
      video.src = 'video.mp4';
      video.autoplay = true;
      video.controls = false;
      video.className = 'inline-video';
      actionArea.appendChild(video);

      video.onended = () => {
        clearInterval(textInterval);

        let resultColor = '#000000';
        if (resultText === 'EVET') {
          resultColor = '#FF0000';
        } else if (resultText === 'HAYIR') {
          resultColor = '#008000';
        } else if (resultText === 'BELİRSİZ') {
          resultColor = '#FFD700';
        }

        actionArea.innerHTML = `
          <div id="result" style="color: ${resultColor}">${resultText}</div> <br>
          <button id="askBtn" class="btn btn-primary btn-lg">TEKRAR ALLAHA SOR</button>
        `;
        document.getElementById('askBtn').addEventListener('click', startProcess);
      };
    }

    document.getElementById('askBtn').addEventListener('click', startProcess);
  </script>

</body>
</html>
